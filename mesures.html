<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Fichier Web Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Personnalisation de la barre d'état Android -->
<meta name="theme-color" content="#ff9900">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Métrique Avancé</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #70dfff;
            --accent-puberte: #fff14b;
            --accent-muscu: #36fffd;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Questionnaire initial */
        #questionnaire {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            max-width: 500px;
            margin: 40px auto;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }

        button.btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }

        /* Navigation Principale */
        .main-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.2s;
        }

        .nav-btn.active {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        /* Regroupements de sous-onglets */
        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sub-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .sub-btn.active[data-sub="all"] { background: var(--accent); color: white; }
        .sub-btn.active[data-sub="puberte"] { background: var(--accent-puberte); color: white; }
        .sub-btn.active[data-sub="musculation"] { background: var(--accent-muscu); color: white; }

        /* Unités Sélecteurs */
        .unit-selector {
            display: flex;
            gap: 15px;
            background: var(--bg-card);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
            font-size: 0.9rem;
        }

        .unit-selector label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-main);
        }

        .unit-selector input {
            width: auto;
        }

        /* Intitulés cliquables en texte brut */
        .clickable-title {
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            padding: 0;
            text-decoration: underline dashed rgba(255,255,255,0.2);
            margin-bottom: 8px;
            display: inline-block;
        }

        .clickable-title:hover {
            color: var(--accent);
            text-decoration: underline solid var(--accent);
        }

        /* Grilles et formulaires */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Module d'Aide Interactif */
        .help-toggle-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 5px;
            margin-bottom: 10px;
            width: fit-content;
            text-align: left;
        }

        .help-container {
            background: rgba(15, 23, 42, 0.4);
            border: 1px dashed var(--border);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .help-options {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .help-opt-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .help-opt-btn.active {
            border-color: var(--accent);
            color: var(--text-main);
            background: rgba(59, 130, 246, 0.15);
        }

        .help-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .action-btn-card {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: auto;
            width: fit-content;
            transition: background 0.2s;
        }

        .action-btn-card:hover {
            background: var(--accent-puberte);
        }

        .evol-box {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ÉTAPE 1 : QUESTIONNAIRE DE PROFIL -->
    <div id="questionnaire" class="hidden">
        <h2 style="margin-bottom: 20px;">Configuration de votre profil</h2>
        <div class="form-group">
            <label>Genre</label>
            <select id="profGender">
                <option value="M">Masculin</option>
                <option value="F">Féminin</option>
            </select>
        </div>
        <div class="form-group">
            <label>Date de naissance</label>
            <input type="date" id="profBirth">
        </div>
        <button class="btn-primary" onclick="submitProfile()">Valider et démarrer</button>
    </div>

    <!-- INTERFACE PRINCIPALE (Masquée au départ) -->
    <div id="mainInterface" class="hidden">
        <header style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <span id="profileBadge" style="font-size: 0.85rem; color: var(--text-muted);"></span>
            <div style="display: flex; gap: 10px;">
                <button onclick="window.location.href='graphiques.html'" style="background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600;">📊 Graphiques</button>
                <button onclick="window.location.href='dashboard.html'" style="background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">🏠 Retour Menu</button>
            </div>
        </header>

        <nav class="main-nav">
            <button class="nav-btn active" id="btnView" onclick="switchView('view')">Voir les mesures</button>
            <button class="nav-btn" id="btnAjouter" onclick="switchView('add')">Ajouter des mesures</button>
        </nav>

        <!-- VUE : VOIR LES MESURES -->
        <div id="viewSection">
            <div class="unit-selector">
                <span>Unités d'affichage :</span>
                <label><input type="radio" name="viewLen" value="cm" checked onchange="renderView()"> cm</label>
                <label><input type="radio" name="viewLen" value="in" onchange="renderView()"> pouces (in)</label>
                <label style="margin-left: 15px;"><input type="radio" name="viewWgt" value="kg" checked onchange="renderView()"> kg</label>
                <label><input type="radio" name="viewWgt" value="lbs" onchange="renderView()"> lbs</label>
            </div>

            <div class="sub-tabs">
                <button class="sub-btn active" data-sub="all" onclick="filterSub('all')">Tout voir</button>
                <button class="sub-btn hidden" id="subPuberte" data-sub="puberte" onclick="filterSub('puberte')">Puberté & Croissance</button>
                <button class="sub-btn" data-sub="musculation" onclick="filterSub('musculation')">Musculation</button>
            </div>

            <!-- GALERIE PHOTOS EVOLUTION DANS LA VUE -->
            <div id="photosViewContainer" style="margin-bottom: 20px;"></div>

            <div class="grid" id="viewGrid"></div>
        </div>

        <!-- VUE : AJOUTER DES MESURES -->
        <div id="addSection" class="hidden">
            <!-- SECTEUR SÉLECTION DATE ET HEURE -->
            <div style="background: var(--bg-card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                    <label for="inputDatePrise" style="font-weight: 600; color: var(--accent);">📅 Date et horaire de la prise :</label>
                    <input type="datetime-local" id="inputDatePrise" onchange="updateAgeFromDateInput()" style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; width: auto;">
                </div>
                <div>⏳ Âge calculé : <strong id="autoAge">--</strong></div>
            </div>

            <!-- BOUTON SAUVEGARDE GLOBALE -->
            <button type="button" class="btn-primary" style="margin-bottom: 20px; background: var(--accent-muscu); padding: 14px; font-size: 1rem;" onclick="saveAllEntries()">
                💾 Enregistrer toutes les mesures remplies
            </button>

            <!-- MODULE AJOUT DE PHOTOS DU JOUR -->
            <div class="card" style="margin-bottom: 20px; background: var(--bg-card); padding: 18px; border-radius: 12px; border: 1px solid var(--border);">
                <h3 style="margin-bottom: 8px; font-size: 1.1rem; color: var(--accent);">📷 Photos de suivi du jour</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
                    Ajoute des photos relatives à ton évolution pour la date sélectionnée.
                </p>
                
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;">
                    <button type="button" class="action-btn-card" style="background: var(--accent);" onclick="document.getElementById('photoImportInput').click()">
                        📁 Importer des images (sans limite)
                    </button>
                    <button type="button" class="action-btn-card" style="background: var(--accent-muscu);" onclick="ouvrirCamera()">
                        📸 Prendre une photo (Caméra)
                    </button>
                </div>

                <input type="file" id="photoImportInput" accept="image/*" multiple style="display: none;" onchange="handlePhotoUpload(event)">

                <div id="todayPhotosGallery" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;"></div>
            </div>

            <div class="unit-selector">
                <span>Unités de saisie actuelle :</span>
                <label><input type="radio" name="addLen" value="cm" checked> cm</label>
                <label><input type="radio" name="addLen" value="in"> pouces (in)</label>
                <label style="margin-left: 15px;"><input type="radio" name="addWgt" value="kg" checked> kg</label>
                <label><input type="radio" name="addWgt" value="lbs"> lbs</label>
            </div>

            <div class="grid" id="addGrid"></div>
        </div>
    </div>

    <!-- MODAL CAMÉRA EN DIRECT -->
    <div id="cameraModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2500; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
        <video id="cameraVideo" autoplay playsinline style="max-width:100%; max-height:65vh; border-radius:12px; border:2px solid var(--accent-muscu); background:#000;"></video>
        
        <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
            <button type="button" class="action-btn-card" style="background:var(--accent-muscu); padding:10px 20px; font-size:1rem;" onclick="prendrePhotoCamera()">
                ⚡ Capturer
            </button>
            <button type="button" class="action-btn-card" style="background:var(--accent);" onclick="basculerCamera()">
                🔄 Changer de caméra
            </button>
            <button type="button" class="action-btn-card" style="background:#ef4444;" onclick="fermerCamera()">
                ✕ Annuler
            </button>
        </div>
    </div>

    <!-- MODAL AGRANDISSEMENT PHOTO -->
    <div id="photoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center; cursor:pointer;" onclick="this.style.display='none'">
        <img id="photoModalImg" src="" style="max-width:90%; max-height:90%; border-radius:8px; border: 2px solid var(--accent);">
    </div>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import { chargerDonneesCloud, sauvegarderDonneesCloud } from "./storage.js";

        // Expositions globales pour les onclick HTML
        window.submitProfile = submitProfile;
        window.switchView = switchView;
        window.filterSub = filterSub;
        window.renderView = renderView;
        window.toggleHelp = toggleHelp;
        window.setHelpOption = setHelpOption;
        window.saveSingleEntry = saveSingleEntry;
        window.saveAllEntries = saveAllEntries;
        window.showMetricHistory = showMetricHistory;
        window.handlePhotoUpload = handlePhotoUpload;
        window.deleteTodayPhoto = deleteTodayPhoto;
        window.openModalPhoto = openModalPhoto;
        window.updateAgeFromDateInput = updateAgeFromDateInput;

        // Expositions du module Caméra
        window.ouvrirCamera = ouvrirCamera;
        window.prendrePhotoCamera = prendrePhotoCamera;
        window.basculerCamera = basculerCamera;
        window.fermerCamera = fermerCamera;

        const activeProfile = localStorage.getItem("activeProfile") || sessionStorage.getItem("activeProfile") || "Principal";
        localStorage.setItem("activeProfile", activeProfile);

        const metricsDefinition = [
            { id: "Poids", label: "Poids", type: "weight", cats: ["puberte", "musculation"] },
            { id: "Taille", label: "Taille", type: "length", cats: ["puberte"] },
            { id: "Tete", label: "Tour de Tête", type: "length", cats: ["puberte"] },
            { id: "FrontMenton", label: "Front - Menton", type: "length", cats: ["puberte"] },
            { id: "CouRel", label: "Cou (relâché)", type: "length", cats: ["puberte"] },
            { id: "CouContr", label: "Cou (contracté)", type: "length", cats: ["puberte"] },
            { id: "BicepsDRel", label: "Biceps D (relâché)", type: "length", cats: ["musculation"] },
            { id: "BicepsDContr", label: "Biceps D (contracté)", type: "length", cats: ["musculation"] },
            { id: "BicepsGRel", label: "Biceps G (relâché)", type: "length", cats: ["musculation"] },
            { id: "BicepsGContr", label: "Biceps G (contracté)", type: "length", cats: ["musculation"] },
            { id: "AvantBrasD", label: "Avant-bras D", type: "length", cats: ["musculation"] },
            { id: "AvantBrasG", label: "Avant-bras G", type: "length", cats: ["musculation"] },

            { id: "PoignetG", label: "Poignet G", type: "length", cats: ["puberte"] },

            { id: "PoitrineContr", label: "Poitrine (contracté)", type: "length", cats: ["musculation"] },
            { id: "EpauTour", label: "Tour d'Épaules", type: "length", cats: ["musculation"] },
            { id: "DosLarg", label: "Largeur de Dos", type: "length", cats: ["musculation"] },
            { id: "TailleRel", label: "Tour de Taille (relâché)", type: "length", cats: ["musculation"] },
            { id: "TailleContr", label: "Tour de Taille (contracté)", type: "length", cats: ["musculation"] },
            { id: "VentreNombril", label: "Ventre (nombril)", type: "length", cats: ["musculation"] },
            { id: "HanchesTour", label: "Tour de Hanches", type: "length", cats: ["puberte", "musculation"] },

            { id: "PenisErectLong", label: "Pénis en érection (longueur)", type: "length", cats: ["puberte"] },

        ];

            "BicepsGRel": {

            "AvantBrasD": {

                plusieurs: "Bras droit tendu. Votre partenaire recherche par tâtonnements la circonférence maximale absolue de l'avant-bras (généralement 2 à 4 cm sous l'articulation du coude)."
            },
            "AvantBrasG": {
                seul: "Tendez le bras gauche, main fermée neutre. Utilisez votre main droite pour mesurer la circonférence maximale de l'avant-bras gauche, localisée sur la masse musculaire supérieure.",
                plusieurs: "Bras gauche étendu. Votre partenaire enroule le ruban perpendiculairement à l'axe radial au niveau de la largeur maximale des muscles supinateurs et fléchisseurs."
            },

        let profile = null;

        // Gestionnaire Flux Caméra
        let cameraStream = null;
        let currentFacingMode = 'environment';

        async function ouvrirCamera() {
            document.getElementById('cameraModal').style.display = 'flex';
            await demarrerFluxCamera();
        }

        async function demarrerFluxCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                const videoEl = document.getElementById('cameraVideo');
                videoEl.srcObject = cameraStream;
            } catch (err) {
                alert("Impossible d'accéder à la caméra : " + err.message);
                fermerCamera();
            }
        }

        async function basculerCamera() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            await demarrerFluxCamera();
        }

        async function prendrePhotoCamera() {
            const videoEl = document.getElementById('cameraVideo');
            if (!videoEl || !cameraStream) return;

            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth || 640;
            canvas.height = videoEl.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

            const selectedDate = getSelectedDate();
            const dateStr = selectedDate.toLocaleDateString('fr-FR');

            let record = dataset.find(r => r.date === dateStr);
            if (!record) {
                record = {
                    date: dateStr,
                    timestamp: selectedDate.getTime(),
                    ageStr: document.getElementById("autoAge").innerText,
                    values: {},
                    photos: []
                };
                dataset.push(record);
            }
            if (!record.photos) record.photos = [];
            record.photos.push(compressedBase64);

            await saveAllData();
            renderTodayPhotos();
            fermerCamera();
        }

        function fermerCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            document.getElementById('cameraModal').style.display = 'none';
        }

        async function loadAllData() {
            // 1. Récupération des données locales
            let localData = null;
            const localRaw = localStorage.getItem(`userMetrics_${activeProfile}`);
            if (localRaw) {
                try { localData = JSON.parse(localRaw); } catch(e){}
            }

            if (!localData && activeProfile === "Principal") {
                const oldProfile = localStorage.getItem("user_profile");
                const oldDataset = localStorage.getItem("user_dataset");
                if (oldProfile) {
                    localData = {
                        profile: JSON.parse(oldProfile),
                        dataset: oldDataset ? JSON.parse(oldDataset) : []
                    };
                }
            }

            // 2. Récupération Cloud si connecté
            let cloudData = null;
            if (auth.currentUser) {
                try {
                    const cloudMetrics = await chargerDonneesCloud("userMetrics");
                    if (cloudMetrics && cloudMetrics[activeProfile]) {
                        cloudData = cloudMetrics[activeProfile];
                    }
                } catch (e) {
                    console.error("Erreur lecture Cloud", e);
                }
            }

            // 3. Sélection du jeu de données le plus complet
            const localLen = localData?.dataset?.length || 0;
            const cloudLen = cloudData?.dataset?.length || 0;

            let selectedData = (cloudLen >= localLen && cloudData) ? cloudData : localData;

            if (selectedData && selectedData.profile) {
                profile = selectedData.profile;
                dataset = selectedData.dataset || [];

                // Re-synchronisation immédiate sur le stockage local
                localStorage.setItem(`userMetrics_${activeProfile}`, JSON.stringify({ profile, dataset }));

                document.getElementById("questionnaire").classList.add("hidden");
                document.getElementById("mainInterface").classList.remove("hidden");

                if (profile.eligiblePuberte) {
                    document.getElementById("subPuberte").classList.remove("hidden");
                }

                document.getElementById("profileBadge").innerText = `Profil : ${activeProfile} (${profile.gender === 'M' ? 'Homme' : 'Femme'}) | Né(e) le ${new Date(profile.birthDate).toLocaleDateString('fr-FR')}`;

                initForms();
                renderView();
            } else {
                document.getElementById("questionnaire").classList.remove("hidden");
                document.getElementById("mainInterface").classList.add("hidden");
            }
        }

        async function saveAllData() {
            const profileKey = `userMetrics_${activeProfile}`;
            const dataToSave = {
                profile: profile,
                dataset: dataset
            };

            // Écriture prioritaire en local
            localStorage.setItem(profileKey, JSON.stringify(dataToSave));
            localStorage.setItem("activeProfile", activeProfile);

            // Envoi au Cloud en arrière-plan
            if (auth.currentUser) {
                try {
                    const cloudMetrics = await chargerDonneesCloud("userMetrics") || {};
                    cloudMetrics[activeProfile] = dataToSave;
                    await sauvegarderDonneesCloud("userMetrics", cloudMetrics);
                } catch (e) {
                    console.error("Erreur sauvegarde Cloud metrics", e);
                }
            }
        }

        async function submitProfile() {
            const gender = document.getElementById("profGender").value;
            const birthStr = document.getElementById("profBirth").value;
            if (!birthStr) return alert("Veuillez saisir votre date de naissance.");

            const birthDate = new Date(birthStr);
            const ageDetails = calculateAge(birthDate, new Date());

            profile = {
                gender: gender,
                birthDate: birthStr,
                eligiblePuberte: (gender === "M" && ageDetails.years <= 25) || (gender === "F" && ageDetails.years <= 20)
            };

            await saveAllData();

            document.getElementById("questionnaire").classList.add("hidden");
            document.getElementById("mainInterface").classList.remove("hidden");

            if (profile.eligiblePuberte) {
                document.getElementById("subPuberte").classList.remove("hidden");

            document.getElementById("profileBadge").innerText = `Profil : ${activeProfile} (${gender === 'M' ? 'Homme' : 'Femme'}) | Né(e) le ${new Date(birthStr).toLocaleDateString('fr-FR')}`;
            initForms();
        }

        function calculateAge(birthDate, targetDate) {
            let years = targetDate.getFullYear() - birthDate.getFullYear();
            let months = targetDate.getMonth() - birthDate.getMonth();
            if (months < 0 || (months === 0 && targetDate.getDate() < birthDate.getDate())) {
                years--;
                months = (months + 12) % 12;
            }
            if (targetDate.getDate() < birthDate.getDate()) {
                months = months === 0 ? 11 : months - 1;
            }
            return { years, months };
        }

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handlePhotoUpload(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            const selectedDate = getSelectedDate();
            const dateStr = selectedDate.toLocaleDateString('fr-FR');

            let record = dataset.find(r => r.date === dateStr);
            if (!record) {
                record = {
                    date: dateStr,
                    timestamp: selectedDate.getTime(),
                    ageStr: document.getElementById("autoAge").innerText,
                    values: {},
                    photos: []
                };
                dataset.push(record);
            }
            if (!record.photos) record.photos = [];

            for (const file of files) {
                try {
                    const compressedBase64 = await compressImage(file);
                    record.photos.push(compressedBase64);
                } catch (err) {
                    console.error("Erreur de traitement image", err);
                }
            }

            await saveAllData();
            renderTodayPhotos();
            event.target.value = "";
        }

        function convertToStorage(val, type, unit) {
            if (val === null || val === undefined || isNaN(val)) return null;
            if (type === "length" && unit === "in") return val * 2.54;
            if (type === "weight" && unit === "lbs") return val * 0.45359237;
            return val;
        }

        function convertFromStorage(val, type, targetUnit) {
            if (val === null || val === undefined) return "-";
            if (type === "length" && targetUnit === "in") return (val / 2.54).toFixed(2);
            if (type === "weight" && targetUnit === "lbs") return (val / 0.45359237).toFixed(2);
            return val.toFixed(2);
        }

        async function saveSingleEntry(id, type) {
            const inputEl = document.getElementById(`input_${id}`);
            if (!inputEl || inputEl.value.trim() === "") {
                return alert("Veuillez saisir une valeur numérique valide avant d'ajouter.");
            }
            const inputVal = parseFloat(inputEl.value.replace(',', '.'));
            
            if (isNaN(inputVal)) {
                return alert("Veuillez saisir une valeur numérique valide avant d'ajouter.");
            }

            const lenUnitEl = document.querySelector('input[name="addLen"]:checked');
            const wgtUnitEl = document.querySelector('input[name="addWgt"]:checked');
            const lenUnit = lenUnitEl ? lenUnitEl.value : "cm";
            const wgtUnit = wgtUnitEl ? wgtUnitEl.value : "kg";
            const currentUnit = type === "length" ? lenUnit : wgtUnit;

            const storageVal = convertToStorage(inputVal, type, currentUnit);
            const selectedDate = getSelectedDate();
            const dateStr = selectedDate.toLocaleDateString('fr-FR');

            let record = dataset.find(r => r.date === dateStr);

            if (!record) {
                record = {
                    date: dateStr,
                    timestamp: selectedDate.getTime(),
                    ageStr: document.getElementById("autoAge").innerText,
                    values: {},
                    photos: []
                };
                dataset.push(record);
            }

            record.values[id] = storageVal;
            dataset.sort((a,b) => a.timestamp - b.timestamp);

            await saveAllData();

            inputEl.value = "";
            const metricLabel = metricsDefinition.find(m => m.id === id).label;
            alert(`Mesure "${metricLabel}" enregistrée avec succès pour le ${dateStr} !`);
        }

        async function saveAllEntries() {
            const lenUnitEl = document.querySelector('input[name="addLen"]:checked');
            const wgtUnitEl = document.querySelector('input[name="addWgt"]:checked');
            const lenUnit = lenUnitEl ? lenUnitEl.value : "cm";
            const wgtUnit = wgtUnitEl ? wgtUnitEl.value : "kg";

            const selectedDate = getSelectedDate();
            const dateStr = selectedDate.toLocaleDateString('fr-FR');

            let record = dataset.find(r => r.date === dateStr);
            if (!record) {
                record = {
                    date: dateStr,
                    timestamp: selectedDate.getTime(),
                    ageStr: document.getElementById("autoAge").innerText,
                    values: {},
                    photos: []
                };
                dataset.push(record);
            }

            let countSaved = 0;
            metricsDefinition.forEach(m => {
                const inputEl = document.getElementById(`input_${m.id}`);
                if (inputEl && inputEl.value.trim() !== "") {
                    const rawVal = parseFloat(inputEl.value.replace(',', '.'));
                    if (!isNaN(rawVal)) {
                        const currentUnit = m.type === "length" ? lenUnit : wgtUnit;
                        record.values[m.id] = convertToStorage(rawVal, m.type, currentUnit);
                        inputEl.value = "";
                        countSaved++;
                    }
                }
            });

            if (countSaved === 0) {
                return alert("Veuillez saisir au moins une valeur avant d'enregistrer.");
            }

            dataset.sort((a,b) => a.timestamp - b.timestamp);
            await saveAllData();
            alert(`${countSaved} mesure(s) enregistrée(s) avec succès pour le ${dateStr} !`);
        }

        function renderView() {
            const viewGrid = document.getElementById("viewGrid");
            const photosContainer = document.getElementById("photosViewContainer");

            const entriesWithPhotos = dataset.filter(r => r.photos && r.photos.length > 0);
            if (entriesWithPhotos.length > 0) {
                photosContainer.innerHTML = `
                    <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px;">
                        <h3 style="color: var(--accent); margin-bottom: 12px; font-size: 1.05rem;">📷 Galerie Photos d'Évolution</h3>
                        <div style="display: flex; gap: 15px; overflow-x: auto; padding-bottom: 8px;">
                            ${entriesWithPhotos.map(entry => `
                                <div style="flex: 0 0 auto; text-align: center;">
                                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px;">${entry.date}</div>
                                    <div style="display: flex; gap: 6px;">
                                        ${entry.photos.map(p => `
                                            <img src="${p}" onclick="openModalPhoto('${p}')" style="width: 75px; height: 75px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid var(--border);">
                                        `).join("")}
                                    </div>
                                </div>
                            `).join("")}
                        </div>
                    </div>
                `;
            } else {
                photosContainer.innerHTML = "";
            }

            if (dataset.length === 0) {
                viewGrid.innerHTML = "<p style='color:var(--text-muted); grid-column: 1/-1; text-align:center; padding: 40px;'>Aucune donnée disponible. Cliquez sur 'Ajouter des mesures' pour commencer.</p>";
                return;
            }

            const outLenUnit = document.querySelector('input[name="viewLen"]:checked').value;
            const outWgtUnit = document.querySelector('input[name="viewWgt"]:checked').value;

            viewGrid.innerHTML = metricsDefinition.map(m => {
                const targetUnit = m.type === "length" ? outLenUnit : outWgtUnit;
                const metricHistory = dataset.filter(r => r.values && r.values[m.id] !== undefined && r.values[m.id] !== null);
                
                let currentRaw = null;
                let prevRaw = null;
                let firstRaw = null;

                if (metricHistory.length > 0) {
                    currentRaw = metricHistory[metricHistory.length - 1].values[m.id];
                    if (metricHistory.length > 1) {
                        prevRaw = metricHistory[metricHistory.length - 2].values[m.id];
                        firstRaw = metricHistory[0].values[m.id];
                    }
                }

                const currentDisplay = convertFromStorage(currentRaw, m.type, targetUnit);

                let evolPrevText = "Évol/Précédente : -";
                if (currentRaw !== null && prevRaw !== null) {
                    const diff = currentRaw - prevRaw;
                    const diffDisplay = m.type === "length" && targetUnit === "in" ? (diff/2.54) : (m.type === "weight" && targetUnit === "lbs" ? (diff/0.45359237) : diff);
                    const color = diffDisplay > 0 ? "var(--accent-muscu)" : (diffDisplay < 0 ? "#ef4444" : "var(--text-muted)");
                    evolPrevText = `Évol/Précédente : <span style="color:${color}; font-weight:700;">${diffDisplay > 0 ? '+' : ''}${diffDisplay.toFixed(2)} ${targetUnit}</span>`;
                }

                let evolMoyText = "Évol Moyenne/Début : -";
                if (metricHistory.length > 1 && currentRaw !== null && firstRaw !== null) {
                    const totalDiff = currentRaw - firstRaw;
                    const avgDiff = totalDiff / (metricHistory.length - 1);
                    const avgDisplay = m.type === "length" && targetUnit === "in" ? (avgDiff/2.54) : (m.type === "weight" && targetUnit === "lbs" ? (avgDiff/0.45359237) : avgDiff);
                    const color = avgDisplay > 0 ? "var(--accent-muscu)" : (avgDisplay < 0 ? "#ef4444" : "var(--text-muted)");
                    evolMoyText = `Évol Moyenne/Début : <span style="color:${color}; font-weight:700;">${avgDisplay > 0 ? '+' : ''}${avgDisplay.toFixed(2)} ${targetUnit}</span>`;
                }

                const serializedCats = JSON.stringify(m.cats);

                return `
                    <div class="card view-card" data-cats='${serializedCats}'>
                        <button class="clickable-title" onclick="showMetricHistory('${m.id}', '${m.label}', '${m.type}')">
                            ${m.label}
                        </button>
                        <div style="font-size: 1.8rem; font-weight: 800; margin-top: 5px;">
                            ${currentDisplay} <span style="font-size: 1rem; color: var(--text-muted); font-weight: normal;">${targetUnit}</span>
                        </div>
                        <div class="evol-box">
                            <div>${evolPrevText}</div>
                            <div>${evolMoyText}</div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function filterSub(cat) {
            document.querySelectorAll(".sub-btn").forEach(b => b.classList.remove("active"));
            event.target.classList.add("active");

            document.querySelectorAll(".view-card").forEach(card => {
                const cardCats = JSON.parse(card.getAttribute("data-cats"));
                if (cat === "all" || cardCats.includes(cat)) {
                    card.classList.remove("hidden");
                } else {
                    card.classList.add("hidden");
                }
            });
        }

        function showMetricHistory(id, label, type) {
            const outLenUnit = document.querySelector('input[name="viewLen"]:checked').value;
            const outWgtUnit = document.querySelector('input[name="viewWgt"]:checked').value;
            const targetUnit = type === "length" ? outLenUnit : outWgtUnit;

            let filteredEntries = dataset.filter(entry => entry.values && entry.values[id] !== undefined && entry.values[id] !== null);

            let logs = filteredEntries.map(entry => {
                const displayVal = convertFromStorage(entry.values[id], type, targetUnit);
                return `• Le ${entry.date} (${entry.ageStr}) : ${displayVal} ${targetUnit}`;
            }).join("\n");

            alert(`Historique complet pour : ${label}\n\n${logs || "Aucun enregistrement pour cette mesure."}`);
        }
    </script>
</body>
</html>
