<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Fichier Web Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Personnalisation de la barre d'état Android -->
    <meta name="theme-color" content="#ff9900">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sélection du Profil</title>
    <link rel="stylesheet" href="style-auth.css"> 
</head>
<body>
    <div id="auth-container">
        <div id="question-box" style="transition: all 0.3s ease;">
            <h1 id="profile-title">Qui est-ce ?</h1>
            <p id="profile-subtitle">Sélectionne un profil pour charger tes données.</p>
            
            <!-- Liste des profils -->
            <div id="profile-list" style="display: flex; flex-direction: column; gap: 12px; margin: 20px 0;">
                <p style="color: #888; text-align: center; margin: 20px 0;">Chargement des profils...</p>
            </div>

            <!-- Zone des boutons d'action -->
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button id="btn-add-profile" style="background-color: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; width: 100%;">
                    + Créer un nouveau profil
                </button>
                
                <button id="btn-logout" style="background-color: #ef4444; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;">
                    🚪 Déconnexion du compte
                </button>
            </div>
        </div>
    </div>

    <!-- MENU CONTEXTUEL D'OPTIONS -->
    <div id="modal-options" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:10px; width:85%; max-width:300px; text-align:center; border: 3px solid #ff9900; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
            <h3 id="modal-profile-title" style="color:#000000; margin-top:0; font-size:1.3rem; border-bottom:2px solid #eee; padding-bottom:10px;">Options du profil</h3>
            
            <button id="opt-rename" style="width:100%; padding:12px; margin:6px 0; background:#ff9900; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:1rem;">✏️ Modifier le nom</button>
            <button id="opt-photo" style="width:100%; padding:12px; margin:6px 0; background:#10b981; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:1rem;">📷 Modifier la photo</button>
            <button id="opt-lock" style="width:100%; padding:12px; margin:6px 0; background:#8b5cf6; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:1rem;">🔒 Mot de passe</button>
            <button id="opt-delete" style="width:100%; padding:12px; margin:6px 0; background:#ef4444; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:1rem;">🗑️ Supprimer le profil</button>
            
            <button id="opt-cancel" style="width:100%; padding:10px; margin-top:10px; background:#6b7280; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:0.9rem;">Annuler</button>
        </div>
    </div>

    <input type="file" id="hidden-file-input" accept="image/*" style="display: none;">

    <!-- SDKs Firebase indispensables -->
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

    <script type="module">
        import { chargerDonneesCloud, sauvegarderDonneesCloud } from "./storage.js";
        import { auth } from "./firebase-config.js";

        const LIMITES_PROFILS = { gratuit: 1, pro: 3, premium: 10, plus_ultra: 25 };
        const CODES_ADMIN = ["ADMIN123", "MASTER2026", "TATO_DEV"]; 

        let comptesProfils = { Profils: [] };
        let userGrade = "gratuit";
        let estConnecteCloud = false;
        
        let indexProfilCible = null;
        let timerAppuiLong;
        let appuiLongDeclenche = false;

        const defaultAvatar = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23888888"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/></svg>`;

        sessionStorage.removeItem("activeProfile");

        // Écouteurs d'événements
        document.getElementById("btn-add-profile").addEventListener("click", creerNouveauProfil);
        document.getElementById("btn-logout").addEventListener("click", deconnexion);
        document.getElementById("hidden-file-input").addEventListener("change", gérerChangementImage);
        
        document.getElementById("opt-rename").addEventListener("click", actionModifierNom);
        document.getElementById("opt-photo").addEventListener("click", actionModifierPhoto);
        document.getElementById("opt-lock").addEventListener("click", actionGererMotDePasse);
        document.getElementById("opt-delete").addEventListener("click", actionSupprimerProfil);
        document.getElementById("opt-cancel").addEventListener("click", fermerModal);

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            estConnecteCloud = true;
            const uid = user.uid;
            const localKey = `userProfiles_${uid}`;

            let accountData = await chargerDonneesCloud("accountData") || JSON.parse(localStorage.getItem(`accountData_${uid}`)) || {};
            let baseData = await chargerDonneesCloud("userAnswers") || JSON.parse(localStorage.getItem(`userAnswers_${uid}`)) || {};

            userGrade = accountData.grade || baseData.grade || "gratuit";

            if (userGrade !== "gratuit" && !accountData.grade) {
                accountData.grade = userGrade;
                localStorage.setItem(`accountData_${uid}`, JSON.stringify(accountData));
                await sauvegarderDonneesCloud("accountData", accountData);
            }

            document.getElementById("btn-add-profile").style.display = "block";

            // Chargement cloud / local
            const donneeCloud = await chargerDonneesCloud("userProfiles");
            const donneeLocale = JSON.parse(localStorage.getItem(localKey));

            if (donneeCloud && Array.isArray(donneeCloud.Profils)) {
                comptesProfils = donneeCloud;
            } else if (donneeLocale && Array.isArray(donneeLocale.Profils)) {
                comptesProfils = donneeLocale;
            } else {
                comptesProfils = { Profils: [{ name: "Principal", pdp: "", password: "" }] };
                await enregistrerProfils();
            }

            // Nettoyage et formatage
            comptesProfils.Profils = comptesProfils.Profils
                .filter(p => p !== null && p !== undefined)
                .map(p => {
                    if (typeof p === "string") return { name: p, pdp: "", password: "" };
                    return {
                        name: p.name || "Profil",
                        pdp: p.pdp || "",
                        password: p.password || ""
                    };
                });

            localStorage.setItem(localKey, JSON.stringify(comptesProfils));
            afficherProfils();
        });

        function afficherProfils() {
            const container = document.getElementById("profile-list");
            if (!container) return;
            container.innerHTML = "";

            if (comptesProfils.Profils.length === 0) {
                container.innerHTML = `<p style="color: #888; font-style: italic; text-align: center; margin: 20px 0;">Aucun profil créé. Clique ci-dessous pour en ajouter un.</p>`;
                return;
            }

            comptesProfils.Profils.forEach((profil, idx) => {
                if (!profil || !profil.name) return;

                const card = document.createElement("div");
                card.style.cssText = "display: flex; align-items: center; gap: 20px; background: #ffffff; border: 2px solid #ff9900; border-radius: 8px; padding: 12px 20px; margin-bottom: 5px; cursor: pointer; user-select: none; -webkit-user-select: none; transition: transform 0.2s, background 0.2s;";
                
                card.onmouseenter = () => card.style.background = "#fff5e6";
                card.onmouseleave = () => card.style.background = "#ffffff";

                const estSecurise = Boolean(profil.password && String(profil.password).trim() !== "");

                const lancerMinuteur = () => {
                    appuiLongDeclenche = false;
                    timerAppuiLong = setTimeout(() => {
                        appuiLongDeclenche = true;
                        tenterOuvertureOptions(idx);
                    }, 600);
                };

                const couperMinuteur = () => clearTimeout(timerAppuiLong);

                card.addEventListener("mousedown", lancerMinuteur);
                card.addEventListener("mouseup", couperMinuteur);
                card.addEventListener("mouseleave", couperMinuteur);
                card.addEventListener("touchstart", lancerMinuteur, { passive: true });
                card.addEventListener("touchend", couperMinuteur);
                card.addEventListener("touchmove", couperMinuteur);

                card.onclick = (e) => {
                    if (appuiLongDeclenche) {
                        e.preventDefault();
                        return;
                    }
                    vérifierCodeEtSeConnecter(idx);
                };

                card.oncontextmenu = (e) => {
                    e.preventDefault();
                    tenterOuvertureOptions(idx);
                };

                const img = document.createElement("img");
                img.src = profil.pdp || defaultAvatar;
                img.style.cssText = "width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #ff9900; background: #222;";

                const nameSpan = document.createElement("span");
                nameSpan.innerText = profil.name + (estSecurise ? " 🔒" : "");
                nameSpan.style.cssText = "color: #000000; font-weight: bold; font-size: 1.2rem; flex-grow: 1; text-align: left;";

                card.appendChild(img);
                card.appendChild(nameSpan);
                container.appendChild(card);
            });
        }

        function tenterOuvertureOptions(idx) {
            const profil = comptesProfils.Profils[idx];
            if (profil.password && String(profil.password).trim() !== "") {
                const check = prompt(`Profil verrouillé. Saisis le mot de passe pour accéder aux options :`);
                if (check === null) return;
                const net = check.trim();
                if (net !== profil.password && !CODES_ADMIN.includes(net)) {
                    alert("❌ Mot de passe incorrect.");
                    return;
                }
            }
            ouvrirMenuOptions(idx);
        }

        function vérifierCodeEtSeConnecter(idx) {
            const profil = comptesProfils.Profils[idx];
            if (profil.password && String(profil.password).trim() !== "") {
                const tentative = prompt(`Le profil "${profil.name}" est verrouillé. Entrez le mot de passe :`);
                if (tentative === null) return; 
                
                const repNettoyee = tentative.trim();
                if (repNettoyee !== profil.password && !CODES_ADMIN.includes(repNettoyee)) {
                    alert("❌ Mot de passe incorrect. Accès refusé !");
                    return;
                }
            }
            sélectionnerProfil(profil.name);
        }

        function ouvrirMenuOptions(idx) {
            indexProfilCible = idx;
            const profil = comptesProfils.Profils[idx];
            document.getElementById("modal-profile-title").innerText = `Options : ${profil.name}`;
            
            const btnLock = document.getElementById("opt-lock");
            btnLock.innerText = profil.password ? "🔓 Retirer le mot de passe" : "🔒 Définir un mot de passe";
            
            document.getElementById("modal-options").style.display = "flex";
        }

        function fermerModal() {
            document.getElementById("modal-options").style.display = "none";
            appuiLongDeclenche = false;
            indexProfilCible = null;
        }

        async function actionModifierNom() {
            if (indexProfilCible === null) return;
            const user = auth.currentUser;
            const profil = comptesProfils.Profils[indexProfilCible];
            const nouveauNom = prompt("Entrez le nouveau nom du profil :", profil.name);
            if (nouveauNom && nouveauNom.trim() !== "") {
                const nomNettoye = nouveauNom.trim();
                const existeDeja = comptesProfils.Profils.some((p, idx) => idx !== indexProfilCible && p.name.toLowerCase() === nomNettoye.toLowerCase());
                if (existeDeja) {
                    alert("Ce nom de profil est déjà utilisé !");
                    return;
                }
                
                if (user) {
                    const me = `userAnswers_${user.uid}_${profil.name}`;
                    const meNew = `userAnswers_${user.uid}_${nomNettoye}`;
                    const meData = localStorage.getItem(me);
                    if (meData) {
                        localStorage.setItem(meNew, meData);
                        localStorage.removeItem(me);
                    }
                }

                comptesProfils.Profils[indexProfilCible].name = nomNettoye;
                fermerModal();
                afficherProfils();
                await enregistrerProfils();
            }
        }

        function actionModifierPhoto() {
            document.getElementById("hidden-file-input").click();
        }

        async function actionGererMotDePasse() {
            if (indexProfilCible === null) return;
            const profil = comptesProfils.Profils[indexProfilCible];
            if (profil.password) {
                if (confirm("Voulez-vous vraiment supprimer le mot de passe de ce profil ?")) {
                    profil.password = "";
                    fermerModal();
                    afficherProfils();
                    await enregistrerProfils();
                }
            } else {
                const pass = prompt(`Définir un mot de passe pour "${profil.name}" :`);
                if (pass !== null && pass.trim() !== "") {
                    profil.password = pass.trim();
                    fermerModal();
                    afficherProfils();
                    await enregistrerProfils();
                }
            }
        }

        async function actionSupprimerProfil() {
            if (indexProfilCible === null) return;
            const user = auth.currentUser;
            const profil = comptesProfils.Profils[indexProfilCible];

            if (confirm(`Es-tu sûr de vouloir supprimer définitivement le profil "${profil.name}" ?`)) {
                const indexASupprimer = indexProfilCible;
                
                if (user) {
                    localStorage.removeItem(`userAnswers_${user.uid}_${profil.name}`);
                }

                comptesProfils.Profils.splice(indexASupprimer, 1);

                fermerModal();
                afficherProfils();

                await enregistrerProfils();
            }
        }

        function deconnexion() {
            if (confirm("Veux-tu te déconnecter de ton compte ?")) {
                localStorage.setItem("manualLogout", "true");
                auth.signOut().then(() => {
                    sessionStorage.clear();
                    window.location.href = "index.html";
                }).catch((error) => alert("Erreur : " + error.message));
            }
        }

        function gérerChangementImage(event) {
            const fichier = event.target.files[0];
            if (!fichier || indexProfilCible === null) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement("canvas");
                    const maxDim = 200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        }
                    } else {
                        if (height > maxDim) {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL("image/jpeg", 0.8);
                    comptesProfils.Profils[indexProfilCible].pdp = compressedBase64;

                    fermerModal();
                    afficherProfils();
                    document.getElementById("hidden-file-input").value = "";
                    await enregistrerProfils();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(fichier);
        }

        async function creerNouveauProfil() {
            const limiteMax = LIMITES_PROFILS[userGrade] || 1;
            
            if (comptesProfils.Profils.length >= limiteMax) {
                alert(`⚠️ Limite atteinte !\n\nTon offre actuelle (${userGrade.toUpperCase()}) limite ton compte à ${limiteMax} profil(s). Passe à une formule payante pour ajouter d'autres profils.`);
                return;
            }

            const nom = prompt(`Nom du nouveau profil :`);
            if (nom && nom.trim() !== "") {
                const nomNettoye = nom.trim();
                const existeDeja = comptesProfils.Profils.some(p => p.name.toLowerCase() === nomNettoye.toLowerCase());
                if (existeDeja) {
                    alert("Ce profil existe déjà !");
                    return;
                }

comptesProfils.Profils.push({ 
    name: nomNettoye, 
    pdp: "", 
    password: "", 
    tutoTermine: false 
});                afficherProfils();
                await enregistrerProfils();

                sessionStorage.setItem("activeProfile", nomNettoye);
                window.location.href = "questionnaire.html";
            }
        }

        async function enregistrerProfils() {
            const user = auth.currentUser;
            if (!user) return;

            localStorage.setItem(`userProfiles_${user.uid}`, JSON.stringify(comptesProfils));

            if (estConnecteCloud) {
                await sauvegarderDonneesCloud("userProfiles", comptesProfils);
            }
        }

        function sélectionnerProfil(nomProfil) {
            sessionStorage.setItem("activeProfile", nomProfil);
            const box = document.getElementById("question-box");
            box.style.opacity = "0";
            setTimeout(() => {
                box.innerHTML = `
                    <h1 style="color: #ff9900; font-size: 2.2rem; margin-bottom: 10px;">Ravi de te voir !</h1>
                    <p style="color: white; font-size: 1.3rem; font-weight: bold;">Content de te retrouver, ${nomProfil}.</p>
                    <div style="margin-top: 25px; color: #888; font-size: 0.9rem;">Chargement de ton univers...</div>
                `;
                box.style.opacity = "1";
            }, 300);
            setTimeout(() => {
                window.location.href = "dashboard.html" + window.location.search;
            }, 1200);
        }
    </script>
</body>
</html>
