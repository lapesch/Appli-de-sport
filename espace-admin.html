<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9900">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Administrateur - Gestion & Suivi</title>

    <script>
      // Vérification immédiate de la session d'administration
      if (sessionStorage.getItem("adminAccorde") !== "true") {
        alert("🔒 Accès réservé aux administrateurs. Veuillez vous authentifier depuis le Tableau de bord.");
        window.location.href = "dashboard.html";
      }
    </script>

    <script src="theme.js"></script>
    <link rel="stylesheet" href="style-dashboard.css">

    <style>
        .admin-nav { display: flex; gap: 10px; margin: 20px 0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { background: var(--box-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        .admin-section { display: none; }
        .admin-section.active { display: block; }
        .muscle-zone { fill: #2a2a40; stroke: var(--border-color); stroke-width: 1.5; cursor: pointer; transition: fill 0.3s; }
        .muscle-zone:hover, .muscle-zone.active { fill: var(--accent-color); }
    </style>
</head>
<body>

    <div class="dashboard-container" style="max-width: 950px;">
        <h1>🛠️ Espace Administrateur</h1>
        <p class="subtitle">Gestion des membres, suivi des mesures et notes d'entraînement</p>

        <div class="admin-nav">
            <button class="tab-btn active" onclick="switchTab('section-membres')">👥 Membres</button>
            <button class="tab-btn" onclick="switchTab('section-suivi')">📈 Suivi & Mesures</button>
            <button class="tab-btn" onclick="switchTab('section-notes')">📝 Notes</button>
        </div>

        <div id="section-membres" class="admin-section active">
            <div style="background-color: var(--box-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="search-bar" placeholder="🔍 Rechercher un membre..." style="flex: 2; padding: 10px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; min-width: 200px;">
                <select id="sort-select" style="flex: 1; padding: 10px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; min-width: 150px;">
                    <option value="alpha">Ordre Alphabétique (A-Z)</option>
                    <option value="grade">Trier par Grade</option>
                </select>
            </div>
            <h3 style="text-align: left; margin-top: 20px; color: var(--accent-color);">👥 Liste des Membres (<span id="member-count">0</span>)</h3>
            <div id="members-list" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px;"></div>
        </div>

        <div id="section-suivi" class="admin-section">
            <div style="display: grid; grid-template-columns: 1fr; gap: 20px; text-align: left;">
                <div style="background: var(--box-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);">
                    <label style="font-weight: bold; display: block; margin-bottom: 10px;">Sélectionner un Athlète :</label>
                    <select id="suivi-member-select" onchange="chargerSuiviMembre()" style="width: 100%; padding: 10px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px;"></select>
                    <div id="biometrie-results" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;"></div>
                </div>

                <div style="background: var(--box-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 20px; align-items: center;">
                    <h4 id="suivi-zone-title" style="margin: 0; color: var(--accent-color);">Sélectionner une zone sur le mannequin</h4>
                    <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%;">
                        <svg width="120" height="240" viewBox="0 0 100 200" style="background: #111; border-radius: 8px;">
                            <circle cx="50" cy="20" r="12" class="muscle-zone" onclick="selectZone('Cou / Trapèzes')"/>
                            <rect x="34" y="38" width="32" height="20" rx="3" class="muscle-zone" onclick="selectZone('Poitrine')"/>
                            <rect x="18" y="38" width="12" height="40" rx="3" class="muscle-zone" onclick="selectZone('Bras Gauche')"/>
                            <rect x="70" y="38" width="12" height="40" rx="3" class="muscle-zone" onclick="selectZone('Bras Droit')"/>
                            <rect x="36" y="62" width="28" height="25" rx="2" class="muscle-zone" onclick="selectZone('Taille / Abdos')"/>
                            <rect x="34" y="92" width="14" height="45" rx="3" class="muscle-zone" onclick="selectZone('Cuisse Gauche')"/>
                            <rect x="52" y="92" width="14" height="45" rx="3" class="muscle-zone" onclick="selectZone('Cuisse Droite')"/>
                        </svg>
                        <div style="flex: 1; min-width: 200px; display: flex; flex-direction: column; justify-content: center;">
                            <span style="font-size: 0.85rem; color: #a8a8b3; margin-bottom: 5px;">Évolution de la zone sélectionnée (6 derniers mois) :</span>
                            <div id="svg-chart-container" style="width: 100%; height: 130px; background: #111; border-radius: 6px; position: relative;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-notes" class="admin-section">
            <div style="background-color: var(--box-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); text-align: left;">
                <h3 style="margin-top: 0; color: var(--accent-color);">📝 Bloc-notes de l'Entraîneur</h3>
                <textarea id="admin-notes-textarea" placeholder="Ex: Penser à corriger la technique..." style="width: 100%; height: 150px; padding: 12px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 8px; resize: vertical; margin-bottom: 15px;"></textarea>
                <button class="btn-popup-option" onclick="sauvegarderNotes()" style="background-color: var(--accent-color); margin: 0; width: auto; padding: 10px 20px;">💾 Sauvegarder les notes</button>
            </div>
        </div>

        <button class="btn-menu" id="btn-back" onclick="window.location.href='dashboard.html'" style="max-width: 200px; margin: 25px auto; display: block;">← Dashboard</button>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.admin-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
